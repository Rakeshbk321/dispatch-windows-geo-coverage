spring.application.name=dispatch-windows

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Bookable days: today plus the next 6, like the 7-day strip on the reference screen.
dispatch.horizon-days=7

# Framework errors (404, 405, 415...) use the same application/problem+json shape as the API's own errors.
spring.mvc.problemdetails.enabled=true

# Each operation documents its own error responses; don't add every advice handler to every operation.
springdoc.override-with-generic-response=false

# On a fresh database, fill the last day of the horizon in La Serena - Coquimbo so a sold-out day is visible.
dispatch.demo-data.enabled=true
